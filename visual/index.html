<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель Управления Логами</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #313338;
            color: #dbdee1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #2b2d31;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 350px;
            text-align: center;
        }
        h2 { color: #f2f3f5; margin-bottom: 10px; }
        p { font-size: 13px; color: #949ba4; margin-bottom: 20px; }
        input {
            width: 90%;
            padding: 10px;
            background: #1e1f22;
            border: 1px solid #000;
            color: white;
            border-radius: 4px;
            margin-bottom: 20px;
            outline: none;
        }
        input:focus { border-color: #5865f2; }
        button {
            width: 100%;
            padding: 12px;
            background: #5865f2;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #4752c4; }
    </style>
</head>
<body>
<div class="container">
    <h2>Настройки Логов</h2>
    <p>Вставьте ID канала, куда бот будет отправлять события.</p>
    <form action="/update" method="post">
        <input type="text" name="channel_id" value="{{ channel_id }}" placeholder="Например: 123456789012345678" required>
        <button type="submit">Сохранить</button>
    </form>
</div>
</body>
</html>
